name: ci

# Smoke test: the tooling byte-compiles and the style-checker suite runs.
#
# The suite's real subject is `style_check.py`, whose rules are DERIVED from the reference corpus
# rather than written down — so its central assertion is self-consistency: every rule the checker
# calls BLOCKING must have zero counterexamples in the corpus. Add a predicate the corpus
# contradicts and CI goes red, which is exactly how four authored style rules shipped as defects
# before this existed.
#
# The reference cards (`classes/ISF/reference_cards.jsonl`) are TRACKED IN GIT, so the full suite
# runs here — including every derived-rule assertion. It used to be an Anki pull, gitignored, and
# these tests skipped; CI reported green while measuring nothing.
#
# This job previously ran `python -m unittest tests.test_reference_deck` — a module that had been
# deleted, so every run failed. It also used unittest, which cannot run this suite at all
# (parametrize / tmp_path / importorskip).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Byte-compile the tooling
        run: python -m py_compile classes/ISF/*.py
      - name: Install test deps
        run: python -m pip install --quiet pytest
      - name: Tests (corpus-dependent ones skip without the private corpus)
        run: python -m pytest tests/ -q
